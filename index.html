<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini 質感文學翻譯工作站 v2.1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Mammoth.js 用於讀取 Word (.docx) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <!-- PDF.js 用於讀取 PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- 頂部導覽列 -->
  <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="text-2xl">📖</span>
        <h1 class="text-lg font-bold text-amber-400">Gemini 雙語文學翻譯站</h1>
        <span class="text-xs bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded border border-emerald-500/30 font-semibold">v2.1 自動重試版</span>
      </div>

      <!-- 模型與 API Key 設定區塊 -->
      <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto justify-end">
        <div class="flex items-center gap-1.5">
          <label for="modelSelect" class="text-xs text-slate-400 whitespace-nowrap">🤖 模型：</label>
          <select id="modelSelect" class="bg-slate-950 border border-slate-600 rounded px-2 py-1.5 text-xs text-amber-300 focus:outline-none focus:border-amber-400">
            <option value="gemini-3.8-flash" selected>gemini-3.8-flash (最新主力)</option>
            <option value="gemini-3.8-flash-lite">gemini-3.8-flash-lite (輕量防塞車)</option>
            <option value="gemini-3.8-pro">gemini-3.8-pro (高階精細)</option>
            <option value="custom">手動輸入其他模型...</option>
          </select>
          <input type="text" id="customModelInput" placeholder="輸入模型名稱" class="hidden bg-slate-950 border border-amber-500 rounded px-2 py-1.5 text-xs text-slate-200 w-36 focus:outline-none" />
        </div>

        <div class="flex items-center gap-1.5 flex-1 sm:flex-initial">
          <label for="apiKeyInput" class="text-xs text-slate-400 whitespace-nowrap font-medium">🔑 API Key：</label>
          <input type="password" id="apiKeyInput" placeholder="請貼上 AIzaSy... 開頭的金鑰" 
                 class="bg-slate-950 border border-slate-600 rounded px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-400 w-full sm:w-60" />
          <button id="saveKeyBtn" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-3 py-1.5 rounded text-xs transition whitespace-nowrap">儲存</button>
        </div>
      </div>
    </div>
  </header>

  <!-- 主工作區 -->
  <main class="max-w-7xl mx-auto p-4 flex-1 grid grid-cols-1 lg:grid-cols-2 gap-4 w-full">
    
    <!-- 左側：輸入與控制區 -->
    <section class="flex flex-col gap-3 bg-slate-800/60 p-4 rounded-xl border border-slate-700/60 shadow-lg">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-slate-300 flex items-center gap-1.5">
          <span>📝</span> 原文輸入 (文字 / 檔案 / 網址)
        </h2>
        <span id="charCount" class="text-xs text-slate-400">0 字元</span>
      </div>

      <!-- 快捷輸入管道 -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
        <label class="flex items-center justify-center gap-2 bg-slate-700/60 hover:bg-slate-700 p-2 rounded-lg cursor-pointer border border-dashed border-slate-500 text-slate-300 transition">
          <span>📁 上傳 PDF / DOCX / TXT</span>
          <input type="file" id="fileInput" accept=".pdf,.docx,.txt" class="hidden" />
        </label>
        <div class="flex gap-1">
          <input type="url" id="urlInput" placeholder="貼上小說網址 (如 AO3)" class="bg-slate-900 border border-slate-600 rounded-l px-2 py-1 text-xs w-full focus:outline-none focus:border-amber-400" />
          <button id="fetchUrlBtn" class="bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded-r text-xs whitespace-nowrap">擷取</button>
        </div>
      </div>

      <!-- 原文文字框 -->
      <textarea id="sourceText" placeholder="請在此貼上欲翻譯的英文原文..." class="w-full h-80 bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm font-mono text-slate-200 resize-none focus:outline-none focus:border-amber-400 leading-relaxed"></textarea>

      <!-- 翻譯原則提示 -->
      <div class="bg-slate-900/60 border border-slate-700/50 rounded-lg p-2.5 text-xs text-slate-400 space-y-1">
        <p class="text-amber-300 font-medium">✨ 已套用翻譯規則（含 503 塞車自動排隊重試）：</p>
        <p>1. 拒絕武俠腔與老派古風 ｜ 2. 逐句完整翻譯不刪減 ｜ 3. 語句修飾自然美麗不超譯 ｜ 4. 中英逐句嚴格對照排列</p>
      </div>

      <div class="flex gap-2">
        <button id="startTranslateBtn" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2 shadow-md">
          <span>✨ 開始中英逐句對照翻譯</span>
        </button>
        <button id="stopTranslateBtn" class="hidden bg-rose-600 hover:bg-rose-700 text-white font-medium px-4 py-2.5 rounded-lg text-sm transition">
          停止
        </button>
      </div>

      <!-- 進度指示 -->
      <div id="progressContainer" class="hidden space-y-1">
        <div class="flex justify-between text-xs text-slate-400">
          <span id="progressText">準備翻譯中...</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="w-full bg-slate-950 rounded-full h-1.5 overflow-hidden">
          <div id="progressBar" class="bg-amber-400 h-1.5 transition-all duration-300 w-0"></div>
        </div>
      </div>
    </section>

    <!-- 右側：翻譯結果展示區 -->
    <section class="flex flex-col bg-slate-800/60 p-4 rounded-xl border border-slate-700/60 shadow-lg">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold text-slate-300 flex items-center gap-1.5">
          <span>📑</span> 雙語對照成果
        </h2>
        <div class="flex gap-2">
          <button id="copyResultBtn" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 px-2.5 py-1 rounded transition">複製全文</button>
          <button id="clearResultBtn" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 px-2.5 py-1 rounded transition">清空</button>
        </div>
      </div>

      <div id="resultContainer" class="flex-1 bg-slate-950 border border-slate-700 rounded-lg p-4 overflow-y-auto space-y-4 max-h-[600px] leading-relaxed text-sm">
        <p class="text-slate-500 text-center py-20 text-xs">翻譯後的內容將以「一句英文、一句中文」形式排列於此...</p>
      </div>
    </section>

  </main>

  <script>
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const modelSelect = document.getElementById('modelSelect');
    const customModelInput = document.getElementById('customModelInput');
    const sourceText = document.getElementById('sourceText');
    const charCount = document.getElementById('charCount');
    const fileInput = document.getElementById('fileInput');
    const urlInput = document.getElementById('urlInput');
    const fetchUrlBtn = document.getElementById('fetchUrlBtn');
    const startTranslateBtn = document.getElementById('startTranslateBtn');
    const stopTranslateBtn = document.getElementById('stopTranslateBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const progressPercent = document.getElementById('progressPercent');
    const resultContainer = document.getElementById('resultContainer');
    const copyResultBtn = document.getElementById('copyResultBtn');
    const clearResultBtn = document.getElementById('clearResultBtn');

    let abortController = null;

    // 載入與儲存 API Key
    const savedKey = localStorage.getItem('gemini_api_key') || '';
    if (savedKey) apiKeyInput.value = savedKey;

    saveKeyBtn.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      if (!key) return alert('請先輸入 API Key！');
      localStorage.setItem('gemini_api_key', key);
      alert('✅ API Key 已成功儲存！');
    });

    modelSelect.addEventListener('change', () => {
      customModelInput.classList.toggle('hidden', modelSelect.value !== 'custom');
    });

    sourceText.addEventListener('input', () => {
      charCount.textContent = `${sourceText.value.length} 字元`;
    });

    // 檔案解析
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const ext = file.name.split('.').pop().toLowerCase();
      try {
        if (ext === 'txt') {
          sourceText.value = await file.text();
        } else if (ext === 'docx') {
          const arrayBuffer = await file.arrayBuffer();
          const res = await mammoth.extractRawText({ arrayBuffer });
          sourceText.value = res.value;
        } else if (ext === 'pdf') {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          let fullText = '';
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            fullText += content.items.map(item => item.str).join(' ') + '\n\n';
          }
          sourceText.value = fullText;
        }
        charCount.textContent = `${sourceText.value.length} 字元`;
        alert(`📄 已成功載入檔案：${file.name}`);
      } catch (err) {
        alert('解析檔案失敗，請確認檔案格式是否正確。');
      }
    });

    // 網址擷取
    fetchUrlBtn.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      if (!url) return alert('請輸入有效網址！');
      fetchUrlBtn.disabled = true;
      fetchUrlBtn.textContent = '抓取中...';
      try {
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
        const res = await fetch(proxyUrl);
        const data = await res.json();
        const parser = new DOMParser();
        const doc = parser.parseFromString(data.contents, 'text/html');
        const storyNode = doc.querySelector('#chapters') || doc.querySelector('.userstuff') || doc.querySelector('article') || doc.body;
        const paragraphs = Array.from(storyNode.querySelectorAll('p')).map(p => p.textContent.trim()).filter(Boolean);
        sourceText.value = paragraphs.join('\n\n') || storyNode.innerText;
        charCount.textContent = `${sourceText.value.length} 字元`;
        alert('🌐 網頁內文已成功載入！');
      } catch (err) {
        alert('擷取失敗，可能是目標網站有反爬蟲阻擋。建議直接複製貼上文字。');
      } finally {
        fetchUrlBtn.disabled = false;
        fetchUrlBtn.textContent = '擷取';
      }
    });

    // 智慧分段合併（將零碎短句組合成約 1500 字元的區塊，減少 API 呼叫次數防塞車）
    function chunkParagraphs(text, maxChars = 1500) {
      const rawLines = text.split(/\n+/).map(p => p.trim()).filter(Boolean);
      const chunks = [];
      let currentChunk = '';
      for (const line of rawLines) {
        if ((currentChunk.length + line.length) > maxChars && currentChunk.length > 0) {
          chunks.push(currentChunk);
          currentChunk = line;
        } else {
          currentChunk = currentChunk ? `${currentChunk}\n${line}` : line;
        }
      }
      if (currentChunk) chunks.push(currentChunk);
      return chunks;
    }

    // 延遲等待工具
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // 呼叫 Gemini API（含 503/429 自動排隊重試機制）
    async function callGeminiWithRetry(apiKey, modelName, systemPrompt, currentChunk, signal, onRetryStatus) {
      const maxRetries = 4;
      const payload = {
        contents: [{ parts: [{ text: `請依規則逐句翻譯以下內容（務必拆分為單句對照）：\n\n${currentChunk}` }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] },
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: {
            type: "ARRAY",
            items: {
              type: "OBJECT",
              properties: {
                en: { type: "STRING" },
                zh: { type: "STRING" }
              },
              required: ["en", "zh"]
            }
          }
        }
      };

      const stdEndpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;

      for (let attempt = 1; attempt <= maxRetries; attempt++) {
        const res = await fetch(stdEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          signal
        });

        if (res.ok) {
          const data = await res.json();
          const rawOutput = data.candidates?.[0]?.content?.parts?.[0]?.text;
          return JSON.parse(rawOutput || '[]');
        }

        // 若遇到 503 (伺服器忙碌) 或 429 (頻率限制)，自動等待後重試
        if ((res.status === 503 || res.status === 429) && attempt < maxRetries) {
          const waitSec = attempt * 4; // 第1次等4秒、第2次等8秒、第3次等12秒
          for (let s = waitSec; s > 0; s--) {
            if (signal.aborted) throw new DOMException('Aborted', 'AbortError');
            onRetryStatus(`⏳ 伺服器尖峰忙碌中 (503)，系統將於 ${s} 秒後自動重試 (第 ${attempt}/${maxRetries - 1} 次)...`);
            await sleep(1000);
          }
          continue;
        }

        const errData = await res.json().catch(() => ({}));
        throw new Error(`HTTP 狀態碼 ${res.status} (模型: ${modelName})：${errData.error?.message || '請求被拒絕'}`);
      }
    }

    // 開始翻譯流程
    startTranslateBtn.addEventListener('click', async () => {
      const apiKey = apiKeyInput.value.trim();
      const text = sourceText.value.trim();
      const selectedModel = modelSelect.value === 'custom' ? customModelInput.value.trim() : modelSelect.value;

      if (!apiKey) return alert('請先在右上角輸入並儲存 Gemini API Key！');
      if (!selectedModel) return alert('請選擇或輸入模型名稱！');
      if (!text) return alert('請先輸入欲翻譯的英文內容！');

      const chunks = chunkParagraphs(text, 1500);
      if (chunks.length === 0) return;

      resultContainer.innerHTML = '';
      progressContainer.classList.remove('hidden');
      startTranslateBtn.classList.add('hidden');
      stopTranslateBtn.classList.remove('hidden');
      abortController = new AbortController();

      const systemPrompt = `你是一位精通英繁雙語的文學翻譯家。請將英文內容翻譯為台灣繁體中文，並嚴格遵循以下五大守則：
1. 不要翻得像中國武俠小說口吻，避免「江湖、大俠、武林、小的、客官、姑娘、罷了」等古風或中國網路用語。
2. 不要擅自刪減段落，必須逐句完整翻譯，不可遺漏細節與描寫。
3. 文筆需自然、流暢、美麗，可為了小說順暢微調修飾，但切勿過度超譯或自行擴寫。
4. 輸出格式必須嚴格遵循 JSON 陣列結構，陣列中每一個物件代表一個句子，格式為：{"en": "英文原句", "zh": "對應中文翻譯"}。
5. 語句修飾得自然漂亮，符合現代文學氣質，不可太文謅謅。`;

      try {
        for (let i = 0; i < chunks.length; i++) {
          const currentChunk = chunks[i];
          const percent = Math.round(((i + 1) / chunks.length) * 100);
          progressPercent.textContent = `${percent}%`;
          progressBar.style.width = `${percent}%`;
          progressText.textContent = `正在使用 ${selectedModel} 翻譯第 ${i + 1} / ${chunks.length} 區塊...`;

          const sentencePairs = await callGeminiWithRetry(
            apiKey,
            selectedModel,
            systemPrompt,
            currentChunk,
            abortController.signal,
            (retryMsg) => { progressText.textContent = retryMsg; }
          );

          const pBlock = document.createElement('div');
          pBlock.className = 'border-b border-slate-800 pb-3 mb-2 space-y-2';

          sentencePairs.forEach(pair => {
            const pairElem = document.createElement('div');
            pairElem.className = 'hover:bg-slate-900/80 p-1.5 rounded transition';
            pairElem.innerHTML = `
              <div class="text-slate-400 text-xs font-serif leading-relaxed">${pair.en}</div>
              <div class="text-amber-100 font-sans leading-relaxed mt-0.5">${pair.zh}</div>
            `;
            pBlock.appendChild(pairElem);
          });

          resultContainer.appendChild(pBlock);
          resultContainer.scrollTop = resultContainer.scrollHeight;
        }
        progressText.textContent = '🎉 翻譯完成！';
      } catch (err) {
        if (err.name === 'AbortError') {
          progressText.textContent = '已手動停止翻譯。';
        } else {
          alert(`翻譯過程發生錯誤：${err.message}`);
          progressText.textContent = '翻譯發生錯誤';
        }
      } finally {
        startTranslateBtn.classList.remove('hidden');
        stopTranslateBtn.classList.add('hidden');
      }
    });

    stopTranslateBtn.addEventListener('click', () => {
      if (abortController) abortController.abort();
    });

    copyResultBtn.addEventListener('click', () => {
      const text = resultContainer.innerText;
      if (!text) return;
      navigator.clipboard.writeText(text);
      alert('已複製所有翻譯對照內容至剪貼簿！');
    });

    clearResultBtn.addEventListener('click', () => {
      resultContainer.innerHTML = '<p class="text-slate-500 text-center py-20 text-xs">已清空結果。</p>';
    });
  </script>
</body>
</html>
